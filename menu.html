<!DOCTYPE html>
<html lang="zh-TW">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>✨ Dreamy Glow 夢幻美妝 ✨</title>
    <link rel="stylesheet" href="main.css">
    <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+TC:wght@300;400;500&display=swap" rel="stylesheet">
</head>

<body>

    <header>
        <div class="banner-overlay">
            <h1>Dreamy Glow</h1>
            <p>喚醒妳的專屬光彩 | 頂級夢幻彩妝</p>
        </div>
    </header>

    <div class="container">
        <main class="product-section">
            <h2 class="section-title">🌸 熱銷夢幻逸品</h2>
            <div id="product-list" class="grid-container">
            </div>
        </main>

        <aside class="cart-section">
            <div class="cart-box">
                <h2>🛍️ 妳的購物袋</h2>
                <div id="cart-items">
                    <p class="empty-msg">購物袋是空的，快去挑選吧～</p>
                </div>
                <hr>
                <div class="cart-total">
                    <span>總金額</span>
                    <span id="total-price">NT$0</span>
                </div>
                <a id="checkout-btn" href="pay.html"
                    style="display:inline-block;text-align:center;padding:10px 20px;background:#ff69b4;color:#fff;border:none;border-radius:6px;text-decoration:none;font-size:1rem;cursor:pointer;">前往結帳
                    ✨</a>
            </div>
        </aside>
    </div>

    <script src="main.js"></script>
</body>

</html>
